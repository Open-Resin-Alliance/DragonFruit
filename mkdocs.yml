site_name: DragonFruit Slicer
site_description: Open-source resin slicer and support-authoring environment for practical print preparation.
site_url: https://dragonfruit-slicer.com/
repo_name: Open-Resin-Alliance/DragonFruit
repo_url: https://github.com/Open-Resin-Alliance/DragonFruit
theme:
  name: material
  logo: assets/branding/simple_icon.svg
  favicon: assets/branding/simple_icon.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
extra_css:
  - stylesheets/dragonfruit-theme.css
extra_javascript:
  - javascripts/homepage-release-feed.js
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
# Internal docs are versioned but never published. See docs/internal/README.md.
exclude_docs: |
  internal/

plugins:
  - search
  - meta
  - social:
      cards_layout: default
markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.superfences
  - toc:
      permalink: true
