[package]
name = "dragonfruit-desktop"
version = "0.1.15"
edition = "2021"

[build-dependencies]
# All tauri crates come from the feat/cef line, which adds the CEF runtime
# backend. macOS/Windows use wry (default); Linux builds pass --features
# tauri-cef. Pinned to a release tag (not `branch`) for reproducibility — see
# the [patch.crates-io] note below and ADR 0005 for the bump procedure.
tauri-build = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.22", features = [] }

[dependencies]
# default-features = false — runtime backend chosen via tauri-wry / tauri-cef features.
tauri = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.22", default-features = false, features = ["compression", "dynamic-acl"] }
# Enabled by the `logging` feature on every backend: tauri-plugin-log declares
# tauri with default-features = false, so it does not pull in wry.
tauri-plugin-log = { version = "2", optional = true }
# wry-only: not yet validated against the CEF runtime.
tauri-plugin-single-instance = { version = "2", optional = true }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
url = "2"
# Only to hand the updater's OffsetDateTime to the frontend as RFC 3339.
time = { version = "0.3", features = ["formatting"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
rfd = "0.15"
rayon = "1.10"
zip = "2"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
# tauri-plugin-updater turns on reqwest's `rustls-no-provider`, which requires the
# application to install a process-wide CryptoProvider. Declared directly so `ring`
# is guaranteed on every platform instead of arriving by feature unification from
# ureq, and so main() can install it explicitly. See issue #615.
rustls = { version = "0.23", default-features = false, features = ["ring"] }
if-addrs = "0.13"
mdns-sd = "0.11"
tungstenite = "0.24"
base64 = "0.22"
sha2 = "0.10"
tokio = { version = "1", features = ["sync", "fs", "time", "rt"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
dragonfruit-slicing-engine = { path = "../rust/dragonfruit-slicing-engine" }
dragonfruit-rtsp-relay = { path = "../rust/dragonfruit-rtsp-relay" }
dragonfruit-islands = { path = "../rust/dragonfruit-islands" }
dragonfruit-mesh-repair = { path = "../rust/dragonfruit-mesh-repair", features = ["manifold"] }
dragonfruit-organic-cut = { path = "../rust/dragonfruit-organic-cut", features = ["manifold"] }
dragonfruit-sdf = { path = "../rust/dragonfruit-sdf" }
dragonfruit-astar = { path = "../rust/dragonfruit-astar" }
flate2 = "1.1.9"
bytemuck = "1"
meshopt = "0.6.2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-macos-fps = { path = "../rust/tauri-plugin-macos-fps" }
libloading = "0.8"

[target.'cfg(target_os = "windows")'.dependencies]
libloading = "0.8"

[features]
default = ["custom-protocol", "tauri-wry"]
custom-protocol = ["tauri/custom-protocol"]
# Runtime backend features — mutually exclusive.
# Default: tauri-wry (WebKitGTK/WebView2/WebKit)
# Linux CEF: --no-default-features --features custom-protocol,tauri-cef
tauri-wry = ["tauri/wry", "logging", "dep:tauri-plugin-single-instance"]
tauri-cef = ["tauri/cef", "logging"]
# File/stdout/webview logging via tauri-plugin-log. Backend-agnostic.
logging = ["dep:tauri-plugin-log"]

# Redirect all transitive tauri crate deps to the feat/cef branch so Cargo
# resolves a single tauri version tree. Safe for macOS/Windows since wry
# remains the default feature on feat/cef.
#
# Pinned to the `tauri-cef-v3.0.0-alpha.22` tag rather than `branch = "feat/cef"`
# so the build is reproducible and cannot silently drift when the upstream
# branch moves. A tag also keeps every crate on a single commit: the previous
# rev-based pinning left `tauri-plugin` on an older commit than the rest, and
# resolved `tauri-utils` TWICE (same 2.8.3, two different commits), compiling
# both copies into the binary.
# Bumping the tag requires the cross-arch rebuild + smoke described in
# ADR 0005, "Bumping the pinned tauri tag".
# To revert to stable: delete this block and switch deps back to crates.io.
[patch.crates-io]
tauri = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.22" }
tauri-build = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.22" }
tauri-runtime = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.22" }
tauri-runtime-wry = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.22" }
tauri-macros = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.22" }
tauri-utils = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.22" }
tauri-codegen = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.22" }
tauri-plugin = { git = "https://github.com/tauri-apps/tauri", tag = "tauri-cef-v3.0.0-alpha.22" }

# Maximum release optimisation: fat LTO collapses all codegen units into one
# link step, enabling inlining and dead-code elimination across crate boundaries.
# Critical for the slicing engine — cross-crate SIMD and rayon dispatch paths
# are 15-30% faster with fat LTO than the default thin/no-LTO build.
[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = "none"  # keep debug info for crash reports; strip handled by Tauri bundler

# Compile ALL dependencies with full optimizations in dev builds.
# The slicer and its deps (flate2, crc32fast, png, zip, rayon) are
# 50-200x slower in debug mode due to heavy numerical/compression work.
# Only the Tauri shell (dragonfruit-desktop) stays unoptimized for fast recompiles.
[profile.dev.package."*"]
opt-level = 3

# The wildcard above only covers registry deps; path deps need explicit entries.
[profile.dev.package.dragonfruit-slicing-engine]
opt-level = 3

# The desktop shell crate contains IPC/glue hot paths (mesh staging/decoding).
# Keep it optimized in dev so bridge overhead measurements are representative.
[profile.dev.package.dragonfruit-desktop]
opt-level = 3
