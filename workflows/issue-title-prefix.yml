name: Issue title prefix

# Adds [BUG] or [FEAT] to the title of issues created from the issue forms,
# in case the reporter deleted the pre-filled prefix.
on:
  issues:
    types: [opened]

permissions: {}

jobs:
  prefix:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add missing prefix
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          # Passed through env, never inlined, because title and body are user input.
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
        run: |
          # Each form leaves a heading only it produces.
          if grep -qF '### Steps to reproduce' <<< "$BODY"; then
            prefix='[BUG]'
          elif grep -qF '### What problem are you trying to solve?' <<< "$BODY"; then
            prefix='[FEAT]'
          else
            echo "Not from an issue form; leaving the title alone."
            exit 0
          fi

          # Already prefixed (any capitalisation)? Nothing to do.
          if [[ "${TITLE,,}" == "${prefix,,}"* ]]; then
            echo "Title already starts with $prefix."
            exit 0
          fi

          gh issue edit "$NUMBER" --title "$prefix $TITLE"
          echo "Renamed #$NUMBER to: $prefix $TITLE"
