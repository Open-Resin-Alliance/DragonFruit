[package]
name = "dragonfruit-plugin-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Open-Resin-Alliance/DragonFruit"
description = "Protocol types and harness for DragonFruit sideloaded plugins"

[lib]
name = "dragonfruit_plugin_sdk"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
