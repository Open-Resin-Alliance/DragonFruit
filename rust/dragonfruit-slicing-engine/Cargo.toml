[package]
name = "dragonfruit-slicing-engine"
version = "3.2.3"
edition = "2021"

[lib]
name = "dragonfruit_slicing_engine"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
rayon = "1.10"
libdeflater = "1"
crc32fast = "1"
png = { version = "0.17", default-features = false }   # needed by ctb_preview thumbnail decoder
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
base64 = "0.22"
aes = "0.8"
cbc = "0.1"
sha2 = "0.10"
time = "=0.3.47"
time-core = "=0.1.8"
crossbeam-channel = "0.5.15"
sysinfo = "0.38"

md-5 = "0.10"

# The LUMEN reference encoder, used by plugins/lumen. A path dependency cannot be
# declared in a plugin's slicing/rust/requiredCrates.toml (the registry generator
# validates those as semver), so the .lumen plugin's dependency lives here - and
# because plugins/lumen is the LumenFormat submodule, the path is inside this
# checkout and arrives with the plugin.
lumen-format = { path = "../../plugins/lumen/rust/lumen" }
[dev-dependencies]

