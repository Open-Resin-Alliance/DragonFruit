name: Build preview

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to build the preview release from
        required: true
        type: string
        default: dev
      pr_run_id:
        description: Workflow run ID of the PR check to download macOS artifacts from
        required: false
        type: string
      release_name:
        description: 'Override release name (e.g. "Feature: Test"). Inferred from branch if empty.'
        required: false
        type: string
  issue_comment:
    types:
      - created

permissions:
  contents: write
  pull-requests: write

concurrency:
  # Comment activations serialise per PR and never cancel each other: they are
  # cheap, and one PR's /preview must not kill another's. Build dispatches keep
  # the old behaviour, where a newer build supersedes an in-flight one for the
  # same branch.
  group: >-
    ${{ github.event_name == 'issue_comment'
        && format('preview-pr-{0}', github.event.issue.number)
        || format('preview-{0}', github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name) }}
  cancel-in-progress: ${{ github.event_name != 'issue_comment' }}

env:
  PREVIEW_LABEL: preview-build

jobs:
  # ── Comment handler: /preview and /create-preview-external ──────────────
  activate-preview:
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/preview') ||
       startsWith(github.event.comment.body, '@github-actions build preview') ||
       startsWith(github.event.comment.body, '/create-preview-external'))
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: write
      # Creates refs/heads/preview/pr-N when importing an external PR. This job
      # only calls the API — it never checks out or runs the PR's code.
      contents: write
    steps:
      - name: Check commenter has write access
        id: check_access
        uses: actions/github-script@v9
        env:
          COMMENT_USER: ${{ github.event.comment.user.login }}
        with:
          result-encoding: string
          script: |
            const commentUser = process.env.COMMENT_USER;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const ADMIN_TEAM = 'administrators';

            // Check 1 — direct collaborator with write+ access
            let hasWrite = false;
            try {
              const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
                owner,
                repo,
                username: commentUser,
              });
              hasWrite = ['write', 'admin', 'maintain'].includes(data.permission);
              core.info(`Repo permission: ${data.permission} → ${hasWrite ? 'granted' : 'denied'}.`);
            } catch (e) {
              if (e.status !== 404) throw e;
              core.info(`User is not a direct collaborator.`);
            }

            // Check 2 — override: member of the administrators team
            let isAdmin = false;
            try {
              const { data } = await github.rest.teams.getMembershipForUserInOrg({
                org: owner,
                team_slug: ADMIN_TEAM,
                username: commentUser,
              });
              isAdmin = data.state === 'active' || data.state === 'pending';
              if (isAdmin) core.info(`User is a member of @${owner}/${ADMIN_TEAM} — override granted.`);
            } catch (e) {
              if (e.status !== 404) throw e;
              core.info(`User is not a member of @${owner}/${ADMIN_TEAM}.`);
            }

            if (hasWrite || isAdmin) return 'granted';
            return 'denied';

      - name: Abort if not authorized
        if: steps.check_access.outputs.result != 'granted'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$PR" \
            --repo "${{ github.repository }}" \
            --body $'### ❌ Access Denied\n\nSorry, only **collaborators with write access** can trigger preview builds.\n\nIf you believe this is a mistake, please contact a maintainer.'

      - name: Fetch PR branch info
        id: pr_info
        if: steps.check_access.outputs.result == 'granted'
        uses: actions/github-script@v9
        env:
          PR: ${{ github.event.issue.number }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt(process.env.PR),
            });

            // head.repo is null once a fork has been deleted, so an unknown
            // head repo counts as external and the routing fails closed.
            const isExternal =
              pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`;

            core.setOutput('head_ref', pr.head.ref);
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('is_external', isExternal ? 'true' : 'false');
            core.info(
              `PR #${pr.number}: head ${pr.head.sha} from ` +
              `${pr.head.repo?.full_name ?? 'a deleted fork'} (external: ${isExternal})`);

      - name: Decide what this comment asks for
        id: route
        if: steps.check_access.outputs.result == 'granted'
        uses: actions/github-script@v9
        env:
          IS_EXTERNAL: ${{ steps.pr_info.outputs.is_external }}
        with:
          result-encoding: string
          script: |
            const wantsExternal =
              context.payload.comment.body.startsWith('/create-preview-external');
            const isExternal = process.env.IS_EXTERNAL === 'true';

            if (wantsExternal && !isExternal) return 'reject-internal';
            if (!wantsExternal && isExternal) return 'reject-external';
            return isExternal ? 'external' : 'internal';

      - name: Explain that an external PR needs the explicit command
        if: steps.route.outputs.result == 'reject-external'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '### ⚠️ This pull request comes from a fork',
                '',
                'A preview build compiles the branch with the release signing',
                'secrets in scope, so `/preview` does not build external pull',
                'requests.',
                '',
                'After reading the diff, a maintainer can import this exact',
                'commit and build it with `/create-preview-external`.',
                '',
                'That imports **one commit**. Later pushes need the command',
                'again, so every external build is one a maintainer chose.',
              ].join('\n'),
            });

      - name: Explain that this PR is not external
        if: steps.route.outputs.result == 'reject-internal'
        uses: actions/github-script@v9
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                '### ℹ️ This pull request is not external',
                '',
                'Its branch already lives in this repository, so there is',
                'nothing to import — use `/preview` instead.',
              ].join('\n'),
            });

      - name: Import the external head into a preview branch
        id: import
        if: steps.route.outputs.result == 'external'
        uses: actions/github-script@v9
        env:
          PR: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ steps.pr_info.outputs.head_sha }}
        with:
          script: |
            // The fork's objects already live in this repository through
            // refs/pull/N/head, so importing is only a ref pointing at the
            // reviewed commit — nothing is pushed and no fork code runs here.
            //
            // Pinning the SHA is the point: refs/pull/N/head keeps following
            // the fork's tip, so building that would build whatever landed
            // after the maintainer read the diff.
            const branch = `preview/pr-${process.env.PR}`;
            const sha = process.env.HEAD_SHA;
            const { owner, repo } = context.repo;

            try {
              await github.rest.git.updateRef({
                owner, repo, ref: `heads/${branch}`, sha, force: true,
              });
              core.info(`Moved ${branch} to ${sha}`);
            } catch (e) {
              if (e.status !== 422 && e.status !== 404) throw e;
              await github.rest.git.createRef({
                owner, repo, ref: `refs/heads/${branch}`, sha,
              });
              core.info(`Created ${branch} at ${sha}`);
            }

            core.setOutput('branch', branch);

      - name: Extract custom release name from comment
        id: extract_name
        if: steps.route.outputs.result == 'internal' || steps.route.outputs.result == 'external'
        uses: actions/github-script@v9
        with:
          result-encoding: string
          script: |
            const body = context.payload.comment.body;
            // Everything after the command (with trailing space) is the custom
            // name. Both commands are accepted, and the prefix that actually
            // matched is the one stripped — /create-preview-external must be
            // tested first, or /preview would never match it.
            for (const prefix of ['/create-preview-external', '/preview']) {
              if (!body.startsWith(prefix)) continue;
              const rest = body.slice(prefix.length).trim();
              if (rest) {
                core.info(`Custom release name detected: "${rest}"`);
                return rest;
              }
              break;
            }
            core.info('No custom release name in comment.');
            return '';

      - name: Add preview-build label
        # Internal PRs only. The label means "rebuild on every push", which is
        # exactly what an external PR must not get.
        if: steps.route.outputs.result == 'internal'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$PR" --add-label "${{ env.PREVIEW_LABEL }}" --repo "${{ github.repository }}"

      - name: Trigger immediate preview build
        if: steps.route.outputs.result == 'internal' || steps.route.outputs.result == 'external'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ steps.pr_info.outputs.base_ref }}
          BUILD_BRANCH: >-
            ${{ steps.route.outputs.result == 'external'
                && steps.import.outputs.branch
                || steps.pr_info.outputs.head_ref }}
          RELEASE_NAME: ${{ steps.extract_name.outputs.result }}
        run: |
          # An array rather than eval: the release name comes out of a comment
          # body and would otherwise be handed back to the shell to re-parse.
          args=(--repo "${{ github.repository }}" --ref "$BASE_BRANCH" -f branch="$BUILD_BRANCH")

          if [[ -n "$RELEASE_NAME" ]]; then
            args+=(-f release_name="$RELEASE_NAME")
          fi

          gh workflow run build-preview.yml "${args[@]}"

      - name: Acknowledge activation
        if: steps.route.outputs.result == 'internal' || steps.route.outputs.result == 'external'
        uses: actions/github-script@v9
        env:
          MODE: ${{ steps.route.outputs.result }}
          HEAD_SHA: ${{ steps.pr_info.outputs.head_sha }}
          BUILD_BRANCH: >-
            ${{ steps.route.outputs.result == 'external'
                && steps.import.outputs.branch
                || steps.pr_info.outputs.head_ref }}
        with:
          script: |
            const external = process.env.MODE === 'external';
            const branch = process.env.BUILD_BRANCH;
            const actions =
              `${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/` +
              `${context.repo.repo}/actions/workflows/build-preview.yml`;

            const rows = external
              ? [
                  `| **Imported commit** | \`${process.env.HEAD_SHA}\` → \`${branch}\` |`,
                  `| **This build** | [Actions tab](${actions}) |`,
                  '| **Future commits** | Not built. Run `/create-preview-external` again to import a newer commit. |',
                ]
              : [
                  `| **This build** | [Actions tab](${actions}) |`,
                  '| **Future commits** | Each new push rebuilds once the macOS check passes |',
                  '| **Deactivate** | Remove the `preview-build` label to stop auto-builds |',
                ];

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: [
                external
                  ? '### 🚀 External preview build triggered'
                  : '### 🚀 Preview build triggered',
                '',
                `A branch-preview build has been dispatched for **\`${branch}\`**.`,
                '',
                '| What | How |',
                '|------|-----|',
                ...rows,
                '',
                '> The pre-release tag is updated in place, so the download link stays the same.',
              ].join('\n'),
            });

  # ── Derive metadata (branch, tag, names) ────────────────────────────────
  derive:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.branch.outputs.branch }}
      safe_branch: ${{ steps.meta.outputs.safe_branch }}
      release_tag: ${{ steps.meta.outputs.release_tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      version: ${{ steps.meta.outputs.version }}
      commit_hash: ${{ steps.meta.outputs.commit_hash }}
      commit_sha: ${{ steps.meta.outputs.commit_sha }}
    steps:
      - name: Determine branch
        id: branch
        run: |
          echo "branch=${{ inputs.branch }}" >> "$GITHUB_OUTPUT"

      # There is deliberately no refs/pull/N/head path here any more. That ref
      # follows the fork's tip, so a build dispatched against it compiled
      # whatever the author pushed last — with the signing secrets in scope.
      # External PRs are imported to a preview/pr-N branch at a reviewed SHA
      # before they get anywhere near this workflow.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.branch.outputs.branch }}
          submodules: recursive
          fetch-depth: 0

      - name: Derive release metadata
        id: meta
        shell: bash
        env:
          RELEASE_NAME_OVERRIDE: ${{ inputs.release_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          commit_hash="$(git rev-parse --short HEAD)"
          commit_sha="$(git rev-parse HEAD)"
          branch_name="${{ steps.branch.outputs.branch }}"

          # Sanitize branch name for tags / filenames
          safe_branch="${branch_name//\//_}"

          # Human-readable release name
          if [[ -n "$RELEASE_NAME_OVERRIDE" ]]; then
            human_name="$RELEASE_NAME_OVERRIDE"
          else
            human_name="$branch_name"
            case "$branch_name" in
              feat/*) human_name="Feature: ${branch_name#feat/}" ;;
              fix/*)  human_name="Fix: ${branch_name#fix/}" ;;
              chore/*) human_name="Chore: ${branch_name#chore/}" ;;
              refactor/*) human_name="Refactor: ${branch_name#refactor/}" ;;
              docs/*) human_name="Docs: ${branch_name#docs/}" ;;
              perf/*) human_name="Perf: ${branch_name#perf/}" ;;
              ci/*)   human_name="CI: ${branch_name#ci/}" ;;
              preview/pr-*) human_name="Preview: PR ${branch_name#preview/pr-}" ;;
              *)      human_name="Preview: ${branch_name}" ;;
            esac

            # Replace underscores and hyphens with spaces, then title-case each word
            rest="${human_name#*: }"
            prefix="${human_name%%: *}"
            rest="${rest//_/ }"
            rest="${rest//-/ }"
            capitalized=""
            for word in $rest; do
              first="$(printf '%s' "${word:0:1}" | tr '[:lower:]' '[:upper:]')"
              capitalized="${capitalized}${first}${word:1} "
            done
            capitalized="${capitalized% }"
            human_name="${prefix}: ${capitalized}"
          fi

          # Imported external PRs live on preview/pr-N, so safe_branch is
          # already "preview_pr-N" — strip the prefix before re-adding it, or
          # the tag comes out as preview_preview_pr-N.
          release_tag="preview_${safe_branch#preview_}"

          echo "branch=${branch_name}" >> "$GITHUB_OUTPUT"
          echo "safe_branch=${safe_branch}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "release_name=${human_name}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "commit_hash=${commit_hash}" >> "$GITHUB_OUTPUT"
          echo "commit_sha=${commit_sha}" >> "$GITHUB_OUTPUT"

  # ── Fetch macOS DMG from PR check run ──────────────────────────────────
  fetch-macos-artifacts:
    if: github.event_name == 'workflow_dispatch' && inputs.pr_run_id
    needs:
      - derive
    runs-on: ubuntu-latest
    steps:
      - name: Download macOS DMG from PR check
        uses: actions/download-artifact@v8
        with:
          name: macos-dmg
          path: macos-artifacts
          run-id: ${{ inputs.pr_run_id }}
          github-token: ${{ github.token }}

      - name: Rename DMG to preview convention
        shell: bash
        env:
          SAFE_BRANCH: ${{ needs.derive.outputs.safe_branch }}
          COMMIT_HASH: ${{ needs.derive.outputs.commit_hash }}
          VERSION: ${{ needs.derive.outputs.version }}
        run: |
          find macos-artifacts -name "*.dmg" -type f 2>/dev/null || echo "No .dmg files found"
          preview_tag="${SAFE_BRANCH}_${COMMIT_HASH}_${VERSION}_DragonFruit_preview"
          src="$(find macos-artifacts -name "*.dmg" -type f | head -1)"
          if [ -n "$src" ]; then
            cp -v "$src" "macos-artifacts/${preview_tag}.dmg"
          else
            echo "No DMG file found in downloaded artifacts"
            exit 1
          fi

      - name: Upload renamed DMG
        uses: actions/upload-artifact@v7
        with:
          name: dragonfruit-macos-universal
          path: macos-artifacts/*_DragonFruit_preview.dmg
          if-no-files-found: error

  # ── Build matrix ────────────────────────────────────────────────────────
  build-tauri:
    name: Build ${{ matrix.artifact_name }}
    # The shipped profile, stated here as well as in Cargo.toml so that
    # `swatinem/rust-cache` keys on it (see `env-vars` below): the compile check
    # links thin and keeps its artifacts under a different key.
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
    needs:
      - derive
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            build_kind: tauri
            args: --target x86_64-pc-windows-msvc --bundles nsis
            artifact_name: dragonfruit-windows-x64
          - platform: ubuntu-22.04
            build_kind: flatpak
            artifact_name: dragonfruit-linux-flatpak-x64
    runs-on: ${{ matrix.platform }}
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.derive.outputs.branch }}
          submodules: recursive

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # Pinned, not `@stable`: the floating channel is what churns the Rust cache
      # key (see warm-rust-cache.yml).
      - name: Read the pinned Rust toolchain
        id: rust_toolchain
        # bash, not the runner's default shell: Windows would run this as pwsh,
        # where `$(sed …)` is a module path, and the step died there.
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}

      # `swatinem/rust-cache` hashes every toolchain `rustup` lists, not only the
      # one the build uses, and the runner image ships its own `stable` (1.98.1
      # when this was written). Pinning the channel alone left the key to move
      # whenever the image moved that one; removing the rest leaves the pinned
      # toolchain as the only Rust input to the key.
      - name: Drop the runner's other Rust toolchains
        shell: bash
        env:
          PINNED: ${{ steps.rust_toolchain.outputs.channel }}
        run: |
          rustup default "$PINNED"
          rustup toolchain list | awk '{print $1}' | while read -r tc; do
            case "$tc" in
              # `system` is a rustc outside rustup, which rustup cannot remove.
              "$PINNED"-* | system) ;;
              *) rustup toolchain uninstall "$tc" || echo "::warning::could not uninstall $tc" ;;
            esac
          done
          rustup toolchain list

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./rust/dragonfruit-voxl-thumbnail -> target
          shared-key: tauri
          env-vars: CARGO_PROFILE_RELEASE_LTO CARGO_PROFILE_RELEASE_CODEGEN_UNITS DF_BUILD_TARGET_TRIPLE CMAKE_OSX_ARCHITECTURES

      - name: Install frontend dependencies
        run: npm ci

      # Next asks for this on every run ("No build cache found"): its compiler and
      # fetch caches live in `.next/cache`, and restoring that across runs is worth
      # a minute or two of each frontend build.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: |
          git config --system core.longpaths true
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f

      - name: Build Tauri bundle (Windows)
        if: matrix.build_kind == 'tauri'
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          args: ${{ matrix.args }}

      - name: Verify Windows installer runtime payload
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-bundles.ps1 -Formats nsis

      - name: Install Flatpak build tooling
        if: matrix.build_kind == 'flatpak'
        run: sudo apt-get install -y flatpak flatpak-builder appstream desktop-file-utils

      - name: Prepare XDG runtime directory
        if: matrix.build_kind == 'flatpak'
        run: |
          mkdir -p "$RUNNER_TEMP/xdg-runtime"
          chmod 700 "$RUNNER_TEMP/xdg-runtime"
          echo "XDG_RUNTIME_DIR=$RUNNER_TEMP/xdg-runtime" >> "$GITHUB_ENV"

      - name: Configure Flathub remote
        if: matrix.build_kind == 'flatpak'
        run: |
          flatpak remote-add --user --if-not-exists \
            flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install Flatpak runtime dependencies (user)
        if: matrix.build_kind == 'flatpak'
        run: |
          flatpak --user install -y --noninteractive flathub \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Platform//24.08

      - name: Build Tauri app for Flatpak
        if: matrix.build_kind == 'flatpak'
        run: node scripts/tauri-build.mjs --target x86_64-unknown-linux-gnu --no-bundle

      - name: Rename Windows installer
        if: matrix.build_kind == 'tauri'
        shell: bash
        env:
          SAFE_BRANCH: ${{ needs.derive.outputs.safe_branch }}
          COMMIT_HASH: ${{ needs.derive.outputs.commit_hash }}
          VERSION: ${{ needs.derive.outputs.version }}
        run: |
          preview_tag="${SAFE_BRANCH}_${COMMIT_HASH}_${VERSION}_DragonFruit_preview"

          for f in src-tauri/target/*/release/bundle/nsis/*-setup.exe; do
            [ -e "$f" ] && mv -v "$f" "$(dirname "$f")/${preview_tag}.exe"
          done

      - name: Rename flatpak artifact
        if: matrix.build_kind == 'flatpak'
        shell: bash
        env:
          SAFE_BRANCH: ${{ needs.derive.outputs.safe_branch }}
          COMMIT_HASH: ${{ needs.derive.outputs.commit_hash }}
          VERSION: ${{ needs.derive.outputs.version }}
        run: |
          preview_tag="${SAFE_BRANCH}_${COMMIT_HASH}_${VERSION}_DragonFruit_preview"

          for f in src-tauri/target/release/bundle/flatpak/*.flatpak; do
            [ -e "$f" ] && mv -v "$f" "$(dirname "$f")/${preview_tag}.flatpak"
          done

      - name: Upload Windows installer
        if: matrix.build_kind == 'tauri'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/*/release/bundle/nsis/*_DragonFruit_preview.exe
          if-no-files-found: error

      - name: Upload flatpak artifact
        if: matrix.build_kind == 'flatpak'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: src-tauri/target/release/bundle/flatpak/*_DragonFruit_preview.flatpak
          if-no-files-found: error

  # ── Fallback: build macOS Universal natively (manual dispatch, no PR check) ─
  build-macos-fallback:
    name: Build macOS Universal (fallback)
    # The shipped profile, stated here as well as in Cargo.toml so that the cache it
    # restores is the one the warmer wrote (see `env-vars` below); the compile check
    # links thin and keeps its artifacts under a different key.
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      # Stated at job level so `swatinem/rust-cache` sees them (see `env-vars`).
      CMAKE_OSX_ARCHITECTURES: "arm64;x86_64"
      DF_BUILD_TARGET_TRIPLE: universal-apple-darwin
    # `!cancelled()`, not `always()`: `always()` keeps the job running after the
    # workflow is cancelled, and a superseding dispatch waits in the concurrency
    # group until this one ends. A cancelled run kept its macOS build going for 28
    # minutes and the build that replaced it sat in the queue the whole time.
    if: >-
      !cancelled() &&
      needs.derive.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      (!inputs.pr_run_id || needs.fetch-macos-artifacts.result != 'success')
    needs:
      - derive
      - fetch-macos-artifacts
    runs-on: macos-latest
    permissions:
      # Deliberately no actions: write. This job compiles whatever ref it is
      # handed (npm ci, build.rs) with the Apple certificate and the updater
      # signing key in scope. With actions: write it could dispatch docs-pages
      # and have a poisoned latest.json published to Pages. It makes no calls
      # to the Actions API.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.derive.outputs.branch }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # Pinned, not `@stable`: the floating channel is what churns the Rust cache
      # key (see warm-rust-cache.yml).
      - name: Read the pinned Rust toolchain
        id: rust_toolchain
        # bash, not the runner's default shell: Windows would run this as pwsh,
        # where `$(sed …)` is a module path, and the step died there.
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASS }}

      # `swatinem/rust-cache` hashes every toolchain `rustup` lists, not only the
      # one the build uses, and the runner image ships its own `stable` (1.98.1
      # when this was written). Pinning the channel alone left the key to move
      # whenever the image moved that one; removing the rest leaves the pinned
      # toolchain as the only Rust input to the key.
      - name: Drop the runner's other Rust toolchains
        shell: bash
        env:
          PINNED: ${{ steps.rust_toolchain.outputs.channel }}
        run: |
          rustup default "$PINNED"
          rustup toolchain list | awk '{print $1}' | while read -r tc; do
            case "$tc" in
              # `system` is a rustc outside rustup, which rustup cannot remove.
              "$PINNED"-* | system) ;;
              *) rustup toolchain uninstall "$tc" || echo "::warning::could not uninstall $tc" ;;
            esac
          done
          rustup toolchain list

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./rust/dragonfruit-voxl-thumbnail -> target
          shared-key: tauri
          env-vars: CARGO_PROFILE_RELEASE_LTO CARGO_PROFILE_RELEASE_CODEGEN_UNITS DF_BUILD_TARGET_TRIPLE CMAKE_OSX_ARCHITECTURES

      - name: Install frontend dependencies
        run: npm ci

      # Next asks for this on every run ("No build cache found"): its compiler and
      # fetch caches live in `.next/cache`, and restoring that across runs is worth
      # a minute or two of each frontend build.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build Tauri universal macOS bundle
        uses: tauri-apps/tauri-action@v0
        env:
          CMAKE_OSX_ARCHITECTURES: "arm64;x86_64"
          DF_BUILD_TARGET_TRIPLE: universal-apple-darwin
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: MHNF3GA2MM
        with:
          tauriScript: npx tauri
          args: --target universal-apple-darwin --bundles app,dmg

      - name: Embed QuickLook extension + verify universal bundle
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: MHNF3GA2MM
        run: |
          node scripts/macos-embed-appex.mjs --target universal-apple-darwin
          node scripts/verify-universal-bundle.mjs

      - name: Rename DMG for preview release
        shell: bash
        env:
          SAFE_BRANCH: ${{ needs.derive.outputs.safe_branch }}
          COMMIT_HASH: ${{ needs.derive.outputs.commit_hash }}
          VERSION: ${{ needs.derive.outputs.version }}
        run: |
          preview_tag="${SAFE_BRANCH}_${COMMIT_HASH}_${VERSION}_DragonFruit_preview"

          for f in src-tauri/target/*/release/bundle/dmg/*.dmg; do
            [ -e "$f" ] && mv -v "$f" "$(dirname "$f")/${preview_tag}.dmg"
          done

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: dragonfruit-macos-universal
          path: src-tauri/target/*/release/bundle/dmg/*_DragonFruit_preview.dmg
          if-no-files-found: error

  # ── Publish preview prerelease ──────────────────────────────────────────
  publish-preview:
    name: Publish preview prerelease
    if: always() && !cancelled() && needs.derive.result == 'success' && needs.build-tauri.result == 'success'
    needs:
      - derive
      - build-tauri
      - fetch-macos-artifacts
      - build-macos-fallback
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets

      - name: Remove old preview release if exists
        uses: actions/github-script@v9
        env:
          TAG: ${{ needs.derive.outputs.release_tag }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG;

            try {
              const { data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              console.log(`Found existing release id=${release.id}, deleting...`);
              await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });

              try {
                await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
                console.log(`Deleted tag ${tag}`);
              } catch (e) {
                if (e.status !== 422) throw e;
                console.log(`Tag ${tag} did not exist (422).`);
              }
            } catch (e) {
              if (e.status === 404) {
                console.log(`No existing release for tag ${tag}, clean slate.`);
              } else {
                throw e;
              }
            }

      - name: Create tag
        uses: actions/github-script@v9
        env:
          TAG_NAME: ${{ needs.derive.outputs.release_tag }}
          COMMIT_SHA: ${{ needs.derive.outputs.commit_sha }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.TAG_NAME;
            const sha = process.env.COMMIT_SHA;

            await github.rest.git.createRef({
              owner,
              repo,
              ref: `refs/tags/${tag}`,
              sha
            });

      - name: Publish preview prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.derive.outputs.release_tag }}
          name: ${{ needs.derive.outputs.release_name }}
          body: |
            🌙 **Branch preview build** from branch \`${{ needs.derive.outputs.branch }}\`

            | Attribute | Value |
            |---|---|
            | Version | ${{ needs.derive.outputs.version }} |
            | Commit | ${{ needs.derive.outputs.commit_hash }} |
            | Branch | ${{ needs.derive.outputs.branch }} |

            ⚠️ This is an automated pre-release built from a feature branch. It is intended for testing purposes only.
          prerelease: true
          draft: false
          target_commitish: ${{ needs.derive.outputs.commit_sha }}
          files: |
            release-assets/**/*
