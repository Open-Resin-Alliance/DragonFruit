name: PR macOS build check

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

jobs:
  macos-build:
    name: macOS compile check (Universal)
    runs-on: macos-latest
    # The check links thin unless the artifact ships (see the build step). These sit
    # on the job rather than only on the build because `swatinem/rust-cache` keys on
    # them through `env-vars` below: a profile change alters every crate's
    # fingerprint, so without this the job restores a cache it cannot use and then
    # declines to save the one it just built, which is what happened the first time
    # this landed (399 crates recompiled on every run).
    env:
      CARGO_PROFILE_RELEASE_LTO: ${{ contains(github.event.pull_request.labels.*.name, 'preview-build') && 'fat' || 'thin' }}
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ contains(github.event.pull_request.labels.*.name, 'preview-build') && '1' || '16' }}
      # One arch is enough to check that the app compiles and bundles, and it halves
      # the two compiles and the two links, which is the bulk of this job. The
      # shipped path stays universal: a `preview-build` run (whose DMG the preview
      # release downloads) and the release itself both build both arches, so an
      # x86_64-only break is still caught there.
      DF_BUILD_TARGET_TRIPLE: ${{ contains(github.event.pull_request.labels.*.name, 'preview-build') && 'universal-apple-darwin' || 'aarch64-apple-darwin' }}
      CMAKE_OSX_ARCHITECTURES: ${{ contains(github.event.pull_request.labels.*.name, 'preview-build') && 'arm64;x86_64' || 'arm64' }}
    permissions:
      actions: write
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit_hash: ${{ steps.version.outputs.commit_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # `rust-toolchain.toml` pins the toolchain and its Apple targets, and rustup
      # installs what that file names. `@stable` installed the rolling channel
      # instead, which is what `swatinem/rust-cache` hashes: Rust 1.99.0 shipping
      # moved every macOS cache key at once (`...-773432c4-*` -> `...-d94a1be7-*`)
      # and the next build check compiled dependencies from scratch, 28 minutes
      # against 19 warm. Installing the pinned channel keeps CI on the same
      # toolchain as a dev machine and moves the key only when the file is bumped.
      - name: Read the pinned Rust toolchain
        id: rust_toolchain
        # bash, not the runner's default shell: Windows would run this as pwsh,
        # where `$(sed …)` is a module path, and the step died there.
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Check for Apple signing secret
        id: apple_cert
        shell: bash
        run: echo "available=${{ secrets.APPLE_CERTIFICATE != '' }}" >> "$GITHUB_OUTPUT"

      - name: Install Apple Certificate
        if: steps.apple_cert.outputs.available == 'true'
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASS }}

      - name: Fall back to ad-hoc signing if Developer ID cert is unavailable
        shell: bash
        run: |
          if ! security find-identity -v -p codesigning 2>/dev/null | grep -q "Developer ID Application: Pascal Krumme (MHNF3GA2MM)"; then
            echo "⚠️ Developer ID certificate not found in keychain — falling back to ad-hoc signing"
            node -e "
              const fs = require('fs');
              const p = 'src-tauri/tauri.macos.conf.json';
              const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
              cfg.bundle.macOS.signingIdentity = '-';
              fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + '\n');
            "
          else
            echo "✅ Developer ID certificate available — using full codesigning"
          fi

      - name: Export Apple Team ID for notarization
        run: echo "APPLE_TEAM_ID=MHNF3GA2MM" >> "$GITHUB_ENV"

      # `swatinem/rust-cache` hashes every toolchain `rustup` lists, not only the
      # one the build uses, and the runner image ships its own `stable` (1.98.1
      # when this was written). Pinning the channel alone left the key to move
      # whenever the image moved that one; removing the rest leaves the pinned
      # toolchain as the only Rust input to the key.
      - name: Drop the runner's other Rust toolchains
        shell: bash
        env:
          PINNED: ${{ steps.rust_toolchain.outputs.channel }}
        run: |
          rustup default "$PINNED"
          rustup toolchain list | awk '{print $1}' | while read -r tc; do
            case "$tc" in
              # `system` is a rustc outside rustup, which rustup cannot remove.
              "$PINNED"-* | system) ;;
              *) rustup toolchain uninstall "$tc" || echo "::warning::could not uninstall $tc" ;;
            esac
          done
          rustup toolchain list

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./rust/dragonfruit-voxl-thumbnail -> target
          shared-key: tauri
          # The profile and the target are part of the artifacts, so they are part
          # of the key: without this the job restores a cache built the other way,
          # cannot reuse any of it, and skips saving its own.
          env-vars: CARGO_PROFILE_RELEASE_LTO CARGO_PROFILE_RELEASE_CODEGEN_UNITS DF_BUILD_TARGET_TRIPLE CMAKE_OSX_ARCHITECTURES

      - name: Install frontend dependencies
        run: npm ci

      # Next asks for this on every run ("No build cache found"): its compiler and
      # fetch caches live in `.next/cache`, and restoring that across runs is worth
      # a minute or two of each frontend build. Keyed on the lockfile and the
      # sources, with a prefix restore so a commit that changes sources still
      # reuses what it can, which is most of it.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Derive version info
        id: version
        shell: bash
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "commit_hash=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Export Apple notarization credentials for preview builds
        # Also gated on the certificate, not just the label. Without a Developer
        # ID the build falls back to ad-hoc signing, which Apple will not
        # notarize at all — and exporting an empty APPLE_ID is worse than
        # exporting none: tauri-action reads the variable being set as "notarize
        # this", tries to authenticate with nothing, and fails the build with an
        # HTTP 401. Same reason as the TAURI_SIGNING_PRIVATE_KEY guard below.
        if: >-
          steps.apple_cert.outputs.available == 'true' &&
          contains(github.event.pull_request.labels.*.name, 'preview-build')
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
        run: |
          echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
          echo "APPLE_PASSWORD=$APPLE_PASSWORD" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=MHNF3GA2MM" >> "$GITHUB_ENV"

      - name: Generate plugin registry
        run: node scripts/generate-plugin-registry.mjs

      - name: Check for Tauri updater signing secret
        id: tauri_signing
        shell: bash
        run: echo "available=${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - name: Export Tauri updater signing key
        # Tauri updater signing — set these as repo secrets:
        # TAURI_SIGNING_PRIVATE_KEY — content of .tauri/app.key
        # TAURI_SIGNING_PRIVATE_KEY_PASSWORD — optional password set during key gen
        # Only exported when present: tauri-action treats the env var as
        # "signing enabled" merely by being set, even to an empty string,
        # so an unavailable secret (e.g. fork PRs) must leave it unset
        # rather than exported empty.
        if: steps.tauri_signing.outputs.available == 'true'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<TAURI_SIGNING_PRIVATE_KEY_EOF"
            echo "$TAURI_SIGNING_PRIVATE_KEY"
            echo "TAURI_SIGNING_PRIVATE_KEY_EOF"
          } >> "$GITHUB_ENV"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<TAURI_SIGNING_PRIVATE_KEY_PASSWORD_EOF"
            echo "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD"
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD_EOF"
          } >> "$GITHUB_ENV"

      - name: Disable updater artifact signing if no signing key is available
        # tauri.conf.json has createUpdaterArtifacts: true and a pubkey
        # configured, so `tauri build` unconditionally tries to produce a
        # signed .app.tar.gz — and hard-fails ("public key has been found,
        # but no private key") if TAURI_SIGNING_PRIVATE_KEY isn't set. Fork
        # PRs never get that secret, so skip updater artifact generation
        # entirely for this compile-check build; it doesn't need to be
        # updater-installable, just to prove the app builds.
        if: steps.tauri_signing.outputs.available != 'true'
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const p = 'src-tauri/tauri.conf.json';
            const cfg = JSON.parse(fs.readFileSync(p, 'utf8'));
            cfg.bundle.createUpdaterArtifacts = false;
            fs.writeFileSync(p, JSON.stringify(cfg, null, 2) + '\n');
          "

      - name: Build Tauri universal macOS bundle
        uses: tauri-apps/tauri-action@v0
        # The profile and the target live in the job's `env` (above) because the
        # rust-cache step has to see them. The links are the job: thin cut them from
        # 6m06s + 5m48s to 3m18s + 3m07s, and one arch instead of two removes the
        # second one entirely. A `preview-build` PR pays both, because
        # `pr-build-followup.yml` hands its DMG to the preview release and that
        # artifact ships.
        with:
          tauriScript: npx tauri
          args: --target ${{ env.DF_BUILD_TARGET_TRIPLE }} --bundles app,dmg

      - name: Embed QuickLook extension + verify universal bundle
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: MHNF3GA2MM
        run: |
          if [ "${{ env.DF_BUILD_TARGET_TRIPLE }}" = "universal-apple-darwin" ]; then
            node scripts/macos-embed-appex.mjs --target universal-apple-darwin
            node scripts/verify-universal-bundle.mjs
          else
            echo "arm64-only check: the QuickLook extension and the universal verification belong to the artifact that ships, and this run's does not"
          fi

      - name: Rename DMG for preview handoff
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT_HASH: ${{ steps.version.outputs.commit_hash }}
        run: |
          preview_tag="pr-${COMMIT_HASH}_${VERSION}_DragonFruit_preview"

          for f in src-tauri/target/*/release/bundle/dmg/*.dmg; do
            [ -e "$f" ] && mv -v "$f" "$(dirname "$f")/${preview_tag}.dmg"
          done

      - name: Upload DMG artifact
        # Only a `preview-build` run's DMG is handed to the preview release; an
        # arm64-only check has nothing to hand over.
        if: contains(github.event.pull_request.labels.*.name, 'preview-build')
        uses: actions/upload-artifact@v7
        with:
          name: macos-dmg
          path: src-tauri/target/*/release/bundle/dmg/*_DragonFruit_preview.dmg
          if-no-files-found: error
