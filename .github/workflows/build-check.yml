name: Build check

# Fast frontend build gate, complementary to "PR macOS build check".
#
# Two gaps this one covers:
#
#  1. pr-check-build.yml checks out github.event.pull_request.head.sha, i.e. the
#     PR branch on its own. A branch can compile in isolation and still break
#     once merged, when one side deletes a helper the other side is still
#     calling — git reports no conflict and the macOS check stays green. Here we
#     let actions/checkout do its default thing on pull_request, which is to
#     check out the merge commit, so the build sees the post-merge tree.
#
#  2. Nothing compiled on push to dev/main; only unit tests ran. A break landing
#     through a merge commit therefore stayed invisible until release time.
#
# `next build` is the right command because it runs both halves that failed:
# module resolution for the client bundle, and the full TypeScript pass.
# It needs no Rust toolchain, so this stays a couple of minutes on ubuntu.

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Next.js build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        # No `ref:` on purpose — see note 1 above.
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Next asks for this on every run ("No build cache found"): its compiler and
      # fetch caches live in `.next/cache`, and restoring that across runs is worth
      # a minute or two of each frontend build.
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      # `npm run build` triggers prebuild, which generates the plugin registry
      # and the builtin simple plugins; the TypeScript pass fails without them.
      - name: Build
        run: npm run build
