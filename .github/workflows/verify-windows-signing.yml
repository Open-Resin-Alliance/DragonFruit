name: Windows release build (signing check)

# Checks the Azure Artifact Signing path `release.yml` uses, without publishing
# anything.
#
# The `smoke` job signs one throwaway executable through the same config overlay
# and script the release build runs. It needs no Node, no Rust and no npm, so it
# answers "does signing work" in about ninety seconds. Run it after touching
# anything in the signing path.
#
# The `build` job is the full Windows release build, signed, uploaded as an
# artifact. It costs a full release compile, so it only runs when asked.
#
# The signing steps are the shared actions in `.github/actions/windows-signing-*`,
# the same ones `release.yml` and `build-preview.yml` call. The rest of the build
# mirrors the `windows-latest` leg of `release.yml`; keep it in step: a check that
# drifts from the release build stops proving anything.
on:
  workflow_dispatch:
    inputs:
      full_build:
        description: Also build and sign the real installers (about 40 minutes).
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

# One group per mode: a smoke run must not cancel a full build that has already
# spent twenty minutes compiling, and two smokes should still replace each other.
concurrency:
  group: windows-signing-check-${{ inputs.full_build && 'full' || 'smoke' }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Sign a probe
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Azure login, the Artifact Signing module, the signing environment for
      # the bundler, and a probe signature that fails fast with a reason. Shared
      # with the other signing workflows; see the action for the details.
      - name: Windows signing setup
        uses: ./.github/actions/windows-signing-setup
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          signing-endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE }}

      # The bundler is a Rust process, and its spawn of the sign command is what
      # has failed every time. PowerShell resolving that command proves nothing
      # about it, so spawn it from Node instead: libuv searches PATH and calls
      # CreateProcess the way the bundler does. Tauri also absolutizes any
      # argument naming an existing relative path, which this reproduces, so the
      # script is passed the way the bundler passes it.
      - name: Invoke the signing command from a non-PowerShell process
        shell: pwsh
        run: |
          $probe = Join-Path $env:RUNNER_TEMP 'signing-probe-2.exe'
          $source = Join-Path $env:RUNNER_TEMP 'signing-probe-2.cs'
          'public static class Probe2 { public static void Main() {} }' |
            Out-File -FilePath $source -Encoding ascii
          & (Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319\csc.exe') `
            /nologo /target:exe "/out:$probe" $source | Out-Null

          $tauriDir = Join-Path (Get-Location).Path 'src-tauri'
          $overlay = Get-Content (Join-Path $tauriDir 'tauri.windows-signing.conf.json') -Raw | ConvertFrom-Json
          $signCommand = $overlay.bundle.windows.signCommand
          $arguments = @($signCommand.args | ForEach-Object {
            if ($_ -eq '%1') { $probe }
            else {
              $candidate = Join-Path $tauriDir $_
              if (Test-Path -LiteralPath $candidate -PathType Leaf) { (Resolve-Path -LiteralPath $candidate).Path }
              else { $_ }
            }
          })
          $spec = Join-Path $env:RUNNER_TEMP 'sign-command.json'
          @{ cmd = $signCommand.cmd; args = $arguments; cwd = $tauriDir } |
            ConvertTo-Json -Compress | Out-File -FilePath $spec -Encoding utf8

          $spawner = Join-Path $env:RUNNER_TEMP 'spawn-sign.js'
          @'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const spec = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          execFileSync(spec.cmd, spec.args, { stdio: 'inherit', cwd: spec.cwd });
          '@ | Out-File -FilePath $spawner -Encoding utf8

          node $spawner $spec
          if ($LASTEXITCODE -ne 0) {
            throw "The signing command exited $LASTEXITCODE when spawned outside PowerShell."
          }
          $signature = Get-AuthenticodeSignature -LiteralPath $probe
          if (-not $signature.SignerCertificate) {
            throw "The probe came back unsigned: $($signature.StatusMessage)"
          }
          Write-Host "Spawned outside PowerShell: status=$($signature.Status) thumbprint=$($signature.SignerCertificate.Thumbprint)"

      - name: Show the signing log
        if: always()
        uses: ./.github/actions/windows-signing-log

  build:
    name: Signed Windows release build
    needs:
      - smoke
    if: inputs.full_build
    runs-on: windows-latest
    timeout-minutes: 120
    # The shipped profile, stated here as well as in Cargo.toml so that
    # `swatinem/rust-cache` keys on it (see `env-vars` below). The two empty
    # platform variables are here only because the release job lists them in
    # `env-vars`; leaving them out would change the cache key and rebuild every
    # crate from scratch.
    env:
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CMAKE_OSX_ARCHITECTURES: ""
      DF_BUILD_TARGET_TRIPLE: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      # Pinned, not `@stable`: the floating channel is what churns the Rust cache
      # key (see warm-rust-cache.yml).
      - name: Read the pinned Rust toolchain
        id: rust_toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust_toolchain.outputs.channel }}

      # `swatinem/rust-cache` hashes every toolchain `rustup` lists, not only the
      # one the build uses, and the runner image ships its own `stable`. Pinning
      # the channel alone leaves the key to move whenever the image moves that
      # one; removing the rest leaves the pinned toolchain as the only Rust input
      # to the key.
      - name: Drop the runner's other Rust toolchains
        shell: bash
        env:
          PINNED: ${{ steps.rust_toolchain.outputs.channel }}
        run: |
          rustup default "$PINNED"
          rustup toolchain list | awk '{print $1}' | while read -r tc; do
            case "$tc" in
              "$PINNED"-* | system) ;;
              *) rustup toolchain uninstall "$tc" || echo "::warning::could not uninstall $tc" ;;
            esac
          done
          rustup toolchain list

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
            ./rust/dragonfruit-voxl-thumbnail -> target
          shared-key: tauri
          # Same list as the release job, so the two share one cache entry.
          env-vars: CARGO_PROFILE_RELEASE_LTO CARGO_PROFILE_RELEASE_CODEGEN_UNITS DF_BUILD_TARGET_TRIPLE CMAKE_OSX_ARCHITECTURES

      - name: Install frontend dependencies
        run: npm ci

      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'next.config.ts', 'tsconfig.json') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Enable Windows long paths
        run: |
          git config --system core.longpaths true
          reg add "HKLM\SYSTEM\CurrentControlSet\Control\FileSystem" /v LongPathsEnabled /t REG_DWORD /d 1 /f

      # Azure login, the Artifact Signing module, the signing environment for
      # the bundler, and a probe signature that fails fast with a reason. Shared
      # with the other signing workflows; see the action for the details.
      - name: Windows signing setup
        uses: ./.github/actions/windows-signing-setup
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          signing-endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE }}

      - name: Build Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: npx tauri
          args: --target x86_64-pc-windows-msvc --bundles nsis --config src-tauri/tauri.windows-signing.conf.json

      - name: Show the signing log
        if: always()
        uses: ./.github/actions/windows-signing-log

      - name: Verify the signed Windows installers
        uses: ./.github/actions/windows-signing-verify

      - name: Upload signed installers
        uses: actions/upload-artifact@v7
        with:
          name: dragonfruit-windows-x64-signed
          path: src-tauri/target/*/release/bundle/nsis/*
          if-no-files-found: error
